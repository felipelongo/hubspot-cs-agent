# Where this HubSpot portal is described.
# Connecting a new account means editing this file. Do not hardcode these names in TypeScript.

version: 1
portal_name: Demo portal

renewal_pipeline:
  name: Renewals
  stages:
    - Renewal identified
    - Outreach scheduled
    - Negotiation
    - Verbal commit
    - Closed won
    - Closed lost
  closed_won_stage: Closed won
  closed_lost_stage: Closed lost

activity_window_days: 120
renewal_window_days: 180
# ISO week, plus the health band on owner tasks and timeline notes.
idempotency_period: iso_week

cs_lead:
  name: Riley Okonkwo
  email: riley.okonkwo@example.org

ticket_closed_values:
  - "4"
  - closed
  - CLOSED

priority_map:
  HIGH: high
  MEDIUM: medium
  LOW: low

email_direction_map:
  EMAIL: outbound
  INCOMING_EMAIL: inbound
  FORWARDED_EMAIL: outbound
  INCOMING: inbound
  INBOUND: inbound
  incoming: inbound
  inbound: inbound
  REPLIED: replied
  REPLY: replied
  replied: replied
  OUTGOING: outbound
  SENT: outbound
  outgoing: outbound
  outbound: outbound
  BOUNCED: bounced
  bounced: bounced

properties:
  company:
    name: name
    domain: domain
    industry: industry
    employees: numberofemployees
    owner_id: hubspot_owner_id
    health_score: cs_health_score
    health_band: cs_health_band
    risk_reasons: cs_risk_reasons
    last_assessed_at: cs_last_assessed_at
    rules_version: cs_rules_version
    last_run_id: cs_agent_last_run_id
    open_commitments: cs_open_commitments
    plan: plan
    arr: arr
    contract_start: contract_start
    guarantee_multiple: guarantee_multiple
    attributed_gifts_ytd: attributed_gifts_ytd
    hot_leads_delivered_90d: hot_leads_delivered_90d
    hot_leads_followed_up_90d: hot_leads_followed_up_90d
    hot_leads_unworked: hot_leads_unworked
    oldest_unworked_lead_days: oldest_unworked_lead_days
    last_dashboard_login_at: last_dashboard_login_at
    alert_open_rate_30d: alert_open_rate_30d
    fiscal_year_start_month: fiscal_year_start_month
    seed_external_id: seed_external_id
    seed_csm: seed_csm
    seed_origin: seed_origin
  contact:
    email: email
    first_name: firstname
    last_name: lastname
    role: cs_contact_role
    left_company: cs_left_company
    seed_external_id: seed_external_id
    seed_origin: seed_origin
  deal:
    name: dealname
    amount: amount
    close_date: closedate
    stage: dealstage
    pipeline: pipeline
    seed_external_id: seed_external_id
    seed_origin: seed_origin
    stage_regressed: seed_stage_regressed
  ticket:
    subject: subject
    content: content
    priority: hs_ticket_priority
    stage: hs_pipeline_stage
    createdate: createdate
    seed_external_id: seed_external_id
    seed_origin: seed_origin
  note:
    body: hs_note_body
    timestamp: hs_timestamp
  email:
    subject: hs_email_subject
    text: hs_email_text
    direction: hs_email_direction
    status: hs_email_status
    timestamp: hs_timestamp
  meeting:
    title: hs_meeting_title
    body: hs_meeting_body
    start: hs_meeting_start_time
    timestamp: hs_timestamp
  call:
    title: hs_call_title
    body: hs_call_body
    timestamp: hs_timestamp
  task:
    subject: hs_task_subject
    body: hs_task_body
    status: hs_task_status
    priority: hs_task_priority
    due: hs_timestamp
    type: hs_task_type
    owner: hubspot_owner_id

# Platform metrics. A real client can point these at different company fields.
platform:
  plan: plan
  arr: arr
  contract_start: contract_start
  guarantee_multiple: guarantee_multiple
  attributed_gifts_ytd: attributed_gifts_ytd
  hot_leads_delivered_90d: hot_leads_delivered_90d
  hot_leads_followed_up_90d: hot_leads_followed_up_90d
  hot_leads_unworked: hot_leads_unworked
  oldest_unworked_lead_days: oldest_unworked_lead_days
  last_dashboard_login_at: last_dashboard_login_at
  alert_open_rate_30d: alert_open_rate_30d
  fiscal_year_start_month: fiscal_year_start_month

rate_limits:
  # Privately distributed apps. Free and Starter are 100 per 10 seconds.
  # Professional and Enterprise are 190. See docs/hubspot/scopes.md for the citation.
  general_per_10s: 100
  # The CRM search guide allows 5 requests per second per account. Stay under that.
  search_per_second: 4

models:
  fast_env: LLM_MODEL_FAST
  strong_env: LLM_MODEL_STRONG

# Rendered after every procedure. Per-account tone without forking the playbook.
house_style: |
  Write like a calm customer success manager. Be specific, short, and kind.
  Do not hype. Do not invent facts.

# Optional pin of procedure id → version. Empty means "use procedures.lock.json".
procedure_pins: {}

console:
  record_url_template: "https://app.hubspot.com/contacts/{accountId}/record/{objectTypeId}/{id}"
