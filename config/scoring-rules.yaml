# Health score. Start at 100 and subtract. The model does not pick the number.
rules_version: 2.0.0
start: 100
bands:
  healthy: 80
  watch: 60
  at_risk: 40
  critical: 0
rules:
  - id: missing_platform_data
    label: Platform data is missing, so this client is not treated as healthy
    points: -30
    needs_review: true
    when: { signal: missing_platform_data, eq: true }

  - id: champion_left
    label: The development director has left and nobody has replaced them
    points: -35
    when: { signal: champion_left, eq: true }

  - id: leads_unworked
    label: Ready-to-give supporters are waiting with no contact logged
    points: -12
    when: { signal: leads_unworked, eq: true }

  - id: roi_pace_below_half
    label: Attributed gifts are below half the guarantee pace
    points: -30
    when: { signal: roi_pace, lt: 0.5 }

  - id: roi_pace_behind
    label: Attributed gifts are behind the guarantee pace
    points: -15
    when:
      all:
        - { signal: roi_pace, gte: 0.5 }
        - { signal: roi_pace, lt: 0.8 }

  - id: alerts_ignored
    label: Nobody on the client team has opened alerts or logged into the dashboard
    points: -10
    when: { signal: alerts_ignored, eq: true }

  - id: stale_touch
    label: No meaningful touch in 30 to 59 days
    points: -10
    when:
      all:
        - { signal: days_since_last_touch, gte: 30 }
        - { signal: days_since_last_touch, lt: 60 }

  - id: quiet_account
    label: No meaningful touch in 60 days, and follow-up plus guarantee pace do not explain the silence
    points: -20
    when:
      all:
        - { signal: days_since_last_touch, gte: 60 }
        - { not: { signal: engaged_quiet_ok, eq: true } }

  - id: quiet_but_engaged
    label: The CSM has been quiet, but supporters are followed up and gifts are ahead of the guarantee
    points: -3
    when:
      all:
        - { signal: days_since_last_touch, gte: 60 }
        - { signal: engaged_quiet_ok, eq: true }

  - id: open_high_ticket
    label: An open high-priority service request
    points: -15
    cap: 2
    when: { signal: open_high_tickets, each: true }

  - id: open_medium_ticket
    label: An open medium-priority service request
    points: -5
    cap: 3
    when: { signal: open_medium_tickets, each: true }

  - id: negative_sentiment
    label: A recent message reads as angry or disappointed
    points: -12
    when: { signal: negative_sentiment, eq: true }

  - id: renewal_within_30
    label: The renewal closes within 30 days
    points: -12
    when: { signal: days_to_renewal, lte: 30 }

  - id: renewal_before_budget
    label: The renewal falls in the 60 days before the fiscal year starts
    points: -8
    when: { signal: renewal_before_budget, eq: true }
