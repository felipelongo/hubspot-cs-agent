# What can happen on its own, what needs a human, and what goes to the CS lead.
# First matching rule wins. needs_review is first so a bad citation is never auto-written.
version: 2.0.0
rules:
  - id: needs_review_needs_a_human
    comment: A citation failure or missing data is never auto-committed.
    when: { needs_review: true }
    then: approval

  - id: critical_goes_to_the_lead
    comment: The CS lead sees every critical client.
    when: { band: critical }
    then: escalate

  - id: guarantee_refund_exposure
    comment: Attributed gifts under half the guarantee pace can become a refund.
    when: { signal: roi_pace, lt: 0.5 }
    then: escalate

  - id: at_risk_near_renewal
    comment: An at-risk client renewing within 60 days goes to the CS lead.
    when: { band: at_risk, signal: days_to_renewal, lte: 60 }
    then: escalate

  - id: health_properties_are_safe_to_write
    when: { kind: set_properties, target: company }
    then: auto

  - id: tasks_for_the_owner_are_safe
    when: { kind: create_task, assignee: owner }
    then: auto

  - id: timeline_notes_are_safe
    when: { kind: log_note }
    then: auto

  - id: drafted_email_needs_the_owner
    comment: The draft becomes a HubSpot task. A human sends the email.
    when: { kind: draft_outreach }
    then: approval

  - id: stage_changes_need_a_human
    when: { kind: update_deal_stage }
    then: approval

default: approval
